{{- if and (.Values.global.externalSecrets.deploy) (not .Values.externalSecrets.createK8sgearboxMiddlewareSecret) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gearbox-middleware-g3auto
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: gearbox-middleware-g3auto
    creationPolicy: Owner
  data:
  - secretKey: base64Authz.txt
    remoteRef:
      #name of secret in secrets manager
      key: {{include "gearbox-middleware-g3auto" .}}
      property: base64Authz.txt
  - secretKey: gearbox-middleware.env
    remoteRef:
      #name of secret in secrets manager
      key: {{include "gearbox-middleware-g3auto" .}}
      property: gearbox-middleware.env
{{- end }}
---
{{- if and .Values.global.externalSecrets.deploy (not .Values.global.externalSecrets.createLocalK8sSecret) }}
{{- /* Same override handling as db-init.yaml: the DB credentials secret is named after postgres.chartNameOverride (gearbox), not this chart. */ -}}
{{- $dbCtx := deepCopy . -}}
{{- $_ := set $dbCtx "chartNameOverride" (default "" (.Values.postgres).chartNameOverride) -}}
{{ include "common.externalSecret.db" $dbCtx }}
{{- end}}