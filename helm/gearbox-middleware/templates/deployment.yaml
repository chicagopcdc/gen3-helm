apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearbox-middleware-deployment
  labels:
    {{- include "gearbox-middleware.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gearbox-middleware.selectorLabels" . | nindent 6 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 8 }}
  template:
    metadata:
      labels:
        public: "yes"
        s3: "yes"
        {{- include "gearbox-middleware.selectorLabels" . | nindent 8 }}
        {{- include "common.extraLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gearbox-middleware-creds.yaml") . | sha256sum }}
        {{- $metricsEnabled := .Values.metricsEnabled }}
      {{- if eq $metricsEnabled nil }}
        {{- $metricsEnabled = .Values.global.metricsEnabled }}
      {{- end }}
      {{- if eq $metricsEnabled nil }}
        {{- $metricsEnabled = true }}
      {{- end }}

      {{- if $metricsEnabled }}
        {{- include "common.grafanaAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.global.topologySpread.enabled }}
      {{- include "common.TopologySpread" . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "gearbox-middleware.serviceAccountName" . }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken}}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }} 
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds}}
      containers:
        - name: gearbox-middleware
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOSTNAME
              value: {{ .Values.global.hostname | quote }}
            - name: AWS_REGION
              value: {{ .Values.gearboxMiddlewareG3auto.awsRegion | quote }}
            - name: TESTING
              value: {{ .Values.gearboxMiddlewareG3auto.testing | quote }}
            - name: DEBUG
              value: {{ .Values.gearboxMiddlewareG3auto.debug | quote }}
            - name: ALLOWED_ISSUERS
              value: {{ tpl .Values.gearboxMiddlewareG3auto.allowedIssuers . | quote }}
            - name: USER_API
              value: {{ .Values.gearboxMiddlewareG3auto.userApi | quote }}
            - name: FORCE_ISSUER
              value: {{ .Values.gearboxMiddlewareG3auto.forceIssuer | quote }}
            - name: DUMMY_S3
              value: {{ .Values.gearboxMiddlewareG3auto.dummyS3 | quote }}
            - name: ENABLE_PHI
              value: {{ .Values.gearboxMiddlewareG3auto.enablePhi | quote }}
            {{- if .Values.gearboxMiddlewareG3auto.geoapifyApiKey }}
            - name: GEOAPIFY_API_KEY
              value: {{ .Values.gearboxMiddlewareG3auto.geoapifyApiKey | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /_status
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /_status
              port: 80
      initContainers:
        - name: gearbox-db-migrate
          image: "{{ .Values.global.gearboxMatchingImage.repository }}:{{ .Values.global.gearboxMatchingImage.tag }}"
          imagePullPolicy: {{ .Values.global.gearboxMatchingImage.pullPolicy }}
          volumeMounts:
            {{- toYaml .Values.VolumeMounts | nindent 12 }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              poetry run alembic upgrade head