{{- if or (not .Values.global.externalSecrets.deploy) (and .Values.global.externalSecrets.deploy .Values.externalSecrets.createK8sgearboxMiddlewareSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: gearbox-middleware-g3auto
type: Opaque
stringData:
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "gearbox-middleware-g3auto" }}
  {{- $randomPass := printf "%s%s" "gateway:" (randAlphaNum 32) }}
  base64Authz.txt: {{ if and $existingSecret (index $existingSecret.data "base64Authz.txt") }}{{ (index $existingSecret.data "base64Authz.txt") | b64dec | quote }}{{ else }}{{ $randomPass | quote }}{{ end }}
  gearbox-middleware.env: |
    S3_AWS_ACCESS_KEY_ID={{ .Values.gearboxMiddlewareG3auto.awsaccesskey }}
    S3_AWS_SECRET_ACCESS_KEY={{ .Values.gearboxMiddlewareG3auto.awssecretkey }}
{{- end }}