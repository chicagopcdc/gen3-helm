# Default values for audit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  # -- (map) External Secrets settings.
  externalSecrets:
    # -- (bool) Will use ExternalSecret resources to pull secrets from Secrets Manager instead of creating them locally. Be cautious as this will override secrets you have deployed.
    deploy: false
    # -- (bool) Will create the databases and store the creds in Kubernetes Secrets even if externalSecrets is deployed. Useful if you want to use ExternalSecrets for other secrets besides db secrets.
    dbCreate: false
    # -- (string) Will deploy a separate External Secret Store for this service.
    separateSecretStore: false
    # -- (string) Will use a manually deployed clusterSecretStore if defined.
    clusterSecretStoreRef: ""

  # -- (map) AWS configuration
  aws:
    # -- (bool) Set to true if deploying to AWS. Controls ingress annotations.
    enabled: false
    # -- (string) Credentials for AWS stuff.
    awsAccessKeyId:
    # -- (string) Credentials for AWS stuff.
    awsSecretAccessKey:
    # -- (map) Local secret setting if using a pre-exising secret.
    useLocalSecret:
      # -- (bool) Set to true if you would like to use a secret that is already running on your cluster.
      enabled: false
      # -- (string) Name of the local secret.
      localSecretName:
      # -- (string) Namespace of the local secret.
      localSecretNamespace:
    externalSecrets:
      # -- (bool) Whether to use External Secrets for aws config.
      enabled: false
      # -- (String) Name of Secrets Manager secret.
      externalSecretAwsCreds:
  # -- (bool) Whether the deployment is for development purposes.
  dev: true

  postgres:
    # -- (bool) Whether the database should be created.
    createLocalK8sSecret: false
    # -- (string) Name of external secret. Disabled if empty
    externalSecret: ""
    # -- (map) Master credentials to postgres. This is going to be the default postgres server being used for each service, unless each service specifies their own postgres
    master:
      # -- (string) hostname of postgres server
      host:
      # -- (string) username of superuser in postgres. This is used to create or restore databases
      username: postgres
      # -- (string) password for superuser in postgres. This is used to create or restore databases
      password:
      # -- (string) Port for Postgres.
      port: "5432"
  # -- (string) Environment name. This should be the same as vpcname if you're doing an AWS deployment. Currently this is being used to share ALB's if you have multiple namespaces. Might be used other places too.
  environment: default
  # -- (string) Hostname for the deployment.
  hostname: localhost
  # -- (string) ARN of the reverse proxy certificate.
  revproxyArn: arn:aws:acm:us-east-1:123456:certificate
  # -- (string) URL of the data dictionary.
  dictionaryUrl: https://s3.amazonaws.com/dictionary-artifacts/datadictionary/develop/schema.json
  # -- (string) Portal application name.
  portalApp: gitops
  # -- (string) S3 bucket name for Kubernetes manifest files.
  kubeBucket: kube-gen3
  # -- (string) S3 bucket name for log files.
  logsBucket: logs-gen3
  # -- (bool) Whether public datasets are enabled.
  publicDataSets: true
  # -- (string) Access level for tiers. acceptable values for `tier_access_level` are: `libre`, `regular` and `private`. If omitted, by default common will be treated as `private`
  tierAccessLevel: libre
  # -- (int) Only relevant if tireAccessLevel is set to "regular". Summary charts below this limit will not appear for aggregated data.
  tierAccessLimit: "1000"
  # -- (map) Controls network policy settings
  netPolicy:
    enabled: false
  # -- (int) Number of dispatcher jobs.
  dispatcherJobNum: "10"
  # -- (bool) If the service will be deployed with a Pod Disruption Budget. Note- you need to have more than 2 replicas for the pdb to be deployed.
  pdb: false
  # -- (int) The minimum amount of pods that are available at all times if the PDB is deployed.
  minAvailable: 1
  # -- (map) Kubernetes configuration
  crossplane:
    # -- (bool) Set to true if deploying to AWS and want to use crossplane for AWS resources.
    enabled: false
    # -- (string) The name of the crossplane provider config.
    providerConfigName: provider-aws
    # -- (string) OIDC provider URL. This is used for authentication of roles/service accounts.
    oidcProviderUrl: oidc.eks.us-east-1.amazonaws.com/id/12345678901234567890
    # -- (string) The account ID of the AWS account.
    accountId: 123456789012
    s3:
      # -- (string) The kms key id for the s3 bucket.
      kmsKeyId:
      # -- (bool) Whether to use s3 bucket versioning.
      versioningEnabled: false
  #  -- (map) This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    averageCPUValue: 500m
    averageMemoryValue: 500Mi
  # -- (map) Karpenter topology spread configuration.
  topologySpread:
    # -- (bool) Whether to enable topology spread constraints for all subcharts that support it.
    enabled: false
    # -- (string) The topology key to use for spreading. Defaults to "topology.kubernetes.io/zone".
    topologyKey: "topology.kubernetes.io/zone"
    # -- (int) The maxSkew to use for topology spread constraints. Defaults to 1.
    maxSkew: 1
#  -- (map) This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling: {}

# -- (bool) Whether Metrics are enabled.
metricsEnabled:

# -- (map) External Secrets settings.
externalSecrets:
  # -- (string) Will create the Helm "amanuensis-config" secret even if Secrets Manager is enabled. This is helpful if you are wanting to use External Secrets for some, but not all secrets.
  createK8sAmanuensisConfigSecret: false
  # -- (string) Will override the name of the aws secrets manager secret. Default is "amanuensis-config"
  amanuensisConfig:
  # -- (bool) Whether to create the database and Secrets Manager secrets via PushSecret.
  pushSecret: false
  # -- (string) Will override the name of the aws secrets manager secret. Default is "Values.global.environment-.Chart.Name-creds"
  dbcreds:

# -- (map) Secret information for Usersync and External Secrets.
secrets:
  # -- (str) AWS access key ID. Overrides global key.
  awsAccessKeyId:
  # -- (str) AWS access key ID. Overrides global key.
  awsSecretAccessKey:

# -- (map) Postgres database configuration. If db does not exist in postgres cluster and dbCreate is set ot true then these databases will be created for you
postgres:
  # (bool) Whether the database should be restored from s3. Default to global.postgres.dbRestore
  dbRestore: false
  # -- (bool) Whether the database should be created. Default to global.postgres.dbCreate
  dbCreate:
  # -- (string) Hostname for postgres server. This is a service override, defaults to global.postgres.host
  host:
  # -- (string) Database name for postgres. This is a service override, defaults to <serviceName>-<releaseName>
  database:
  # -- (string) Username for postgres. This is a service override, defaults to <serviceName>-<releaseName>
  username:
  # -- (string) Port for Postgres.
  port: "5432"
  # -- (string) Password for Postgres. Will be autogenerated if left empty.
  password:
  # -- (string) Will create a Database for the individual service to help with developing it.
  separate: false

# -- (map) Postgresql subchart settings if deployed separately option is set to "true".
# Disable persistence by default so we can spin up and down ephemeral environments
postgresql:
  primary:
    persistence:
      # -- (bool) Option to persist the dbs data.
      enabled: false

# -- (int) Number of desired replicas
replicaCount: 1

image:
  # -- (string) The Docker image repository for the amanuensis service
  repository: quay.io/pcdc/amanuensis
  # -- (string) When to pull the image. This value should be "Always" to ensure the latest image is used.
  pullPolicy: Always
  # -- (string) Overrides the image tag whose default is the chart appVersion.
  tag: "master"

# -- (list) Docker image pull secrets.
imagePullSecrets: []

# -- (string) Override the name of the chart.
nameOverride: ""

# -- (string) Override the full name of the deployment.
fullnameOverride: ""

# -- (map) Service account to use or create.
serviceAccount:
  # -- (bool) Specifies whether a service account should be created.
  create: true
  # -- (map) Annotations to add to the service account.
  annotations:
    # -- (string) The Amazon Resource Name (ARN) of the role to associate with the service account
    eks.amazonaws.com/role-arn:
  # If not set and create is true, a name is generated using the fullname template
  # -- (string) The name of the service account
  name: "amanuensis-sa"

# -- (map) Annotations to add to the pod
podAnnotations: {}

# -- (map) Security context for the pod
podSecurityContext:
  fsGroup: 101

# -- (map) Security context for the containers in the pod
securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- (map) Kubernetes service information.
service:
  # -- (string) Type of service. Valid values are "ClusterIP", "NodePort", "LoadBalancer", "ExternalName".
  type: ClusterIP
  # -- (int) The port number that the service exposes.
  port: 80

# -- (map) Resource requests and limits for the containers in the pod
resources:
  # -- (map) The amount of resources that the container requests
  requests:
    # -- (string) The amount of memory requested
    memory: 128Mi
  # -- (map) The maximum amount of resources that the container is allowed to use
  limits:
    # -- (string) The maximum amount of memory the container can use
    memory: 2Gi

# -- (map) Node Selector for the pods
nodeSelector: {}

# -- (list) Tolerations for the pods
tolerations: []

# -- (map) Labels to add to the pod.
labels:
  # -- (string) Grants ingress from the revproxy service for pods labeled with public=yes
  public: "yes"
  # -- (string) Grants access to s3 for pods labeled with s3=yes
  s3: "yes"

# -- (map) Affinity to use for the deployment.
affinity:
  podAntiAffinity:
    # -- (map) Option for scheduling to be required or preferred.
    preferredDuringSchedulingIgnoredDuringExecution:
      # -- (int) Weight value for preferred scheduling.
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              # -- (list) Label key for match expression.
              - key: app
                # -- (string) Operation type for the match expression.
                operator: In
                # -- (list) Value for the match expression key.
                values:
                  - amanuensis
          # -- (string) Value for topology key label.
          topologyKey: "kubernetes.io/hostname"

# -- (list) Environment variables to pass to the container
env:
  - name: GEN3_UWSGI_TIMEOUT
    valueFrom:
      configMapKeyRef:
        name: manifest-global
        key: uwsgi-timeout
        optional: true
  - name: AWS_STS_REGIONAL_ENDPOINTS
    value: regional
  - name: PYTHONPATH
    value: /var/www/amanuensis
  - name: GEN3_DEBUG
    value: "False"
  - name: AMANUENSIS_PUBLIC_CONFIG
    valueFrom:
      configMapKeyRef:
        name: manifest-amanuensis
        key: amanuensis-config-public.yaml
        optional: true

# -- (list) Volumes to attach to the container.
volumes:
  - name: logo-volume
    configMap:
      name: "logo-config"
  - name: config-volume
    secret:
      secretName: "amanuensis-config"
  - name: amanuensis-volume
    secret:
      secretName: "amanuensis-creds"
  - name: amanuensis-jwt-keys
    secret:
      secretName: "amanuensis-jwt-keys"
      items:
        - key: jwt_private_key.pem
          path: jwt_private_key.pem
  #need to add potentially
  - name: yaml-merge
    configMap:
      name: "amanuensis-yaml-merge"
      optional: true
  - name: config-volume-public
    configMap:
      name: "manifest-amanuensis"
      optional: true

# -- (list) Volumes to mount to the container.
volumeMounts:
  - name: "logo-volume"
    readOnly: true
    mountPath: "/amanuensis/amanuensis/static/img/logo.svg"
    subPath: "logo.svg"
  - name: "config-volume"
    readOnly: true
    mountPath: "/var/www/amanuensis/amanuensis-config-secret.yaml"
    subPath: amanuensis-config.yaml
  - name: "yaml-merge"
    readOnly: true
    mountPath: "/var/www/amanuensis/yaml_merge.py"
    subPath: yaml_merge.py
  # - name: "amanuensis-volume"
  #   readOnly: true
  #   mountPath: "/var/www/amanuensis/creds.json"
  #   subPath: creds.json
  - name: "amanuensis-jwt-keys"
    readOnly: true
    mountPath: "/var/www/amanuensis/jwt_private_key.pem"
    subPath: "jwt_private_key.pem"
  - name: "config-volume-public"
    readOnly: true
    mountPath: "/var/www/amanuensis/amanuensis-config-public.yaml"
    subPath: amanuensis-config-public.yaml

# Values to determine the labels that are used for the deployment, pod, etc.
# -- (string) Valid options are "production" or "dev". If invalid option is set- the value will default to "dev".
release: "production"
# -- (string) Valid options are "true" or "false". If invalid option is set- the value will default to "false".
criticalService: "true"
# -- (string) Label to help organize pods and their use. Any value is valid, but use "_" or "-" to divide words.
partOf: "ProjectRequest"
# -- (map) Will completely override the selectorLabels defined in the common chart's _label_setup.tpl
selectorLabels:
# -- (map) Will completely override the commonLabels defined in the common chart's _label_setup.tpl
commonLabels:

# -- (map) Public configuration settings for Amanuensis app
AMANUENSIS_CONFIG_PUBLIC: {}

# -- (map) which amanuensis jobs to run
amanuensisJobs:
  clearFilterSetCronjob: false
  dbMigrateJob: true
  validateFilterSetsJob: false

# -- (list) Override the default Command to run in the container.
command: ["/bin/bash"]

# -- (list) Default Command and arguments to run in the container.
args:
  - "-c"
  - |
    python /var/www/amanuensis/yaml_merge.py /var/www/amanuensis/amanuensis-config-public.yaml /var/www/amanuensis/amanuensis-config-secret.yaml /var/www/amanuensis/amanuensis-config.yaml
    if [[ -f /amanuensis/dockerrun.bash ]]; then bash /amanuensis/dockerrun.bash; elif [[ -f /dockerrun.sh ]]; then bash /dockerrun.sh; else echo 'Error: Neither /amanuensis/dockerrun.bash nor /dockerrun.sh exists.' >&2; exit 1; fi

AMANUENSIS_CONFIG:
  ############################### amanuensis Configuration ####################################
  # This file contains various configurations for the amanuensis microservice.
  #
  # README:
  # - This is initially configured for minimal local development with reasonable defaults.
  # - Descriptions for each of the configurations (if any) will be *above* the variable as
  #   comments.
  # - Some configuration variables will have examples commented out below them.
  # - This is broken up into 2 main sections for REQUIRED and OPTIONAL configurations.
  #     - Optional configs will note what features or endpoints they support
  # - Underneath each main section the variables are logically grouped under named
  #   sections.
  #
  # NOTE: Login is NOT ready out of the box. Fill out REQUIRED configurations first

  ########################################################################################
  #                               REQUIRED CONFIGURATIONS                                #
  ########################################################################################

  # //////////////////////////////////////////////////////////////////////////////////////
  # GENERAL
  #   - Fill out all variables!
  # //////////////////////////////////////////////////////////////////////////////////////
  APP_NAME: 'Gen3 Data Commons'
  HOSTNAME: 'localhost'
  # Where amanuensis microservice is deployed
  BASE_URL: 'http://localhost/amanuensis'
  # a standardized name unique to each app for service-to-service interaction
  # so the service receiving the request knows it came from another Gen3 service
  SERVICE_NAME: 'amanuensis'
  # postgres db to connect to
  # connection url format:
  #     postgresql://[user[:password]@][netloc][:port][/dbname]
  DB: 'postgresql://test:test@localhost:5432/amanuensis'

  # A URL-safe base64-encoded 32-byte key for encrypting keys in db
  # in python you can use the following script to generate one:
  #     import base64
  #     import os
  #     key = base64.urlsafe_b64encode(os.urandom(32))
  #     print(key)
  ENCRYPTION_KEY: ''

  # Cross-service keys
  # Private key for signing requests sent to other Gen3 services
  PRIVATE_KEY_PATH: '/var/www/amanuensis/jwt_private_key.pem'

  # //////////////////////////////////////////////////////////////////////////////////////
  # DEBUG & SECURITY SETTINGS
  #   - Modify based on whether you're in a dev environment or in production
  # //////////////////////////////////////////////////////////////////////////////////////
  # flask's debug setting
  # WARNING: DO NOT ENABLE IN PRODUCTION (for testing purposes only)
  DEBUG: true
  # if true, will automatically login a user with username "test"
  # WARNING: DO NOT ENABLE IN PRODUCTION (for testing purposes only)
  MOCK_AUTH: false
  # if true, will fake a successful login response from Google in /login/google
  #     NOTE: this will also modify the behavior of /link/google endpoints
  # WARNING: DO NOT ENABLE IN PRODUCTION (for testing purposes only)
  # will login as the username set in cookie DEV_LOGIN_COOKIE_NAME
  MOCK_GOOGLE_AUTH: false

  # if true, will ignore anything configured in STORAGE_CREDENTIALS
  MOCK_STORAGE: true
  # allow OIDC traffic on http for development. By default it requires https.
  #
  # WARNING: ONLY set to true when amanuensis will be deployed in such a way that it will
  #          ONLY receive traffic from internal clients and can safely use HTTP.
  AUTHLIB_INSECURE_TRANSPORT: true

  # set if you want browsers to only send cookies with requests over HTTPS
  SESSION_COOKIE_SECURE: true

  ENABLE_CSRF_PROTECTION: true

  OIDC_ISSUER: 'https://{{HOSTNAME}}/user'

  OAUTH2:
    client_id: 'oauth2_client_id'
    client_secret: 'oauth2_client_secret'
    api_base_url: 'https://{{HOSTNAME}}/user/'
    authorize_url: 'https://{{HOSTNAME}}/user/oauth2/authorize'
    access_token_url: 'https://{{HOSTNAME}}/user/oauth2/token'
    refresh_token_url: 'https://{{HOSTNAME}}/user/oauth2/token'
    client_kwargs: 
      # redirect_uri: 'https://{{HOSTNAME}}/api/v0/oauth2/authorize'
      redirect_uri: 'https://{{HOSTNAME}}/amanuensis/oauth2/authorize'
      scope: 'openid data user'
    # deprecated key values, should be removed after all commons use new oidc
    internal_oauth_provider: 'http://fence-service/oauth2/'
    oauth_provider: 'https://{{HOSTNAME}}/user/oauth2/'
    # redirect_uri: 'https://{{HOSTNAME}}/api/v0/oauth2/authorize'
    redirect_uri: 'https://{{HOSTNAME}}/amanuensis/oauth2/authorize'

  USER_API: 'https://{{HOSTNAME}}/user'
  # option to force authutils to prioritize USER_API setting over the issuer from
  # token when redirecting, used during local docker compose setup when the
  # services are on different containers but the hostname is still localhost
  FORCE_ISSUER: true

  # amanuensis (at the moment) attempts a migration on startup. setting this to false will disable that
  # WARNING: ONLY set to false if you do NOT want to automatically migrate your database.
  #          You should be careful about incompatible versions of your db schema with what
  #          amanuensis expects. In other words, things could be broken if you update to a later
  #          amanuensis that expects a schema your database isn't migrated to.
  # NOTE: We are working to improve the migration process in the near future
  ENABLE_DB_MIGRATION: true


  # //////////////////////////////////////////////////////////////////////////////////////
  # LIBRARY CONFIGURATION (flask)
  #   - Already contains reasonable defaults
  # //////////////////////////////////////////////////////////////////////////////////////

  # used for flask, "path mounted under by the application / web server"
  # since we deploy as microservices, fence is typically under {{base}}/user
  # this is also why our BASE_URL default ends in /user
  APPLICATION_ROOT: '/amanuensis'

  GET_CONSORTIUMS_URL: 'http://pcdcanalysistools-service/tools/stats/consortiums'

  ########################################################################################
  #                               OPTIONAL CONFIGURATIONS                                #
  ########################################################################################

  # //////////////////////////////////////////////////////////////////////////////////////
  # ASSOCIATED USER DEFAULT ROLE
  # //////////////////////////////////////////////////////////////////////////////////////
  ASSOCIATED_USER_ROLE_DEFAULT: 'METADATA_ACCESS'

  # //////////////////////////////////////////////////////////////////////////////////////
  # ASSOCIATED USER DEFAULT ROLE
  # //////////////////////////////////////////////////////////////////////////////////////
  NOTIFY_STATE: ["DATA_AVAILABLE"]

  # //////////////////////////////////////////////////////////////////////////////////////
  # SUPPORT INFO
  # //////////////////////////////////////////////////////////////////////////////////////
  # If you want an email address to show up when an unhandled error occurs, provide one
  # here. Something like: support@example.com
  SUPPORT_EMAIL_FOR_ERRORS: null


  # //////////////////////////////////////////////////////////////////////////////////////
  # AWS BUCKETS AND CREDENTIALS
  #   - Support `/data` endpoints
  # //////////////////////////////////////////////////////////////////////////////////////
  AWS_CREDENTIALS:
    AWS_SES:
      SENDER: "pcdc_help@lists.uchicago.edu"
      CC_RECIPIENTS: ["lgraglia@bsd.uchicago.edu", "bfurner@bsd.uchicago.edu"]
      RECIPIENT: ""
      region_name: "us-east-1"
      aws_access_key_id: ""
      aws_secret_access_key: ""
    DATA_DELIVERY_S3_BUCKET:
      bucket_name: ""
      aws_access_key_id: ""
      aws_secret_access_key: ""
    
  DATA_AVAILABLE_NOTIFICATION:
    EMAIL_SUBJECT: "Pediatric Cancer Data Common - Your data is ready!"
    EMAIL_BODY: |
    <p>Dear {users}</p>
    <p>The data for the project request <strong>{project_name}</strong> (<strong>{project_id}</strong>) is ready to be downloaded. To download
        your data you will need to login to <a href="https://portal.pedscommons.org/">https://portal.pedscommons.org/</a>.</p>
    <p>Follow the instructions on this page - <a href="https://docs.pedscommons.org/DataPortalUserGuide/#user-menu">https://docs.pedscommons.org/DataPortalUserGuide/#user-menu</a> to access the request and download your data.</p>
    <p>Please respond to this email if you have any issues or questions.</p>
    <p>Best,<br>Luca</p>

  # NOTE: Remove the {} and supply creds if needed. Example in comments below
  #   'CRED1':
  #     aws_access_key_id: ''
  #     aws_secret_access_key: ''
  #   'CRED2':
  #     aws_access_key_id: ''
  #     aws_secret_access_key: ''

  # NOTE: the region is optonal for s3_buckets, however it should be specified to avoid a
  # call to GetBucketLocation which you make lack the AWS ACLs for.
  # public buckets do not need the region field.
  S3_BUCKETS: {}
  # NOTE: Remove the {} and supply buckets if needed. Example in comments below
  #   bucket1:
  #     cred: 'CRED1'
  #     region: 'us-east-1'
  #     # optionally you can manually specify an s3-compliant endpoint for this bucket
  #     endpoint_url: 'https://cleversafe.example.com/'
  #   bucket2:
  #     cred: 'CRED2'
  #     region: 'us-east-1'
  #   bucket3:
  #     cred: '*' # public bucket
  #   bucket4:
  #     cred: 'CRED1'
  #     region: 'us-east-1'
  #     role-arn: 'arn:aws:iam::role1'

  # `DATA_DOWNLOAD_BUCKET` specifies an S3 bucket to which data files are uploaded by the system/admin user,
  # User Data request files are stored here.
  DATA_DOWNLOAD_BUCKET: 'bucket1'

  # //////////////////////////////////////////////////////////////////////////////////////
  # PROXY
  #   - Optional: If the api is behind firewall that needs to set http proxy
  # //////////////////////////////////////////////////////////////////////////////////////
  # NOTE: leave as-is to not use proxy
  # this is only used by the Google Oauth2Client at the moment if provided
  HTTP_PROXY:
    host: null
    port: 3128

  # //////////////////////////////////////////////////////////////////////////////////////
  # MICROSERVICE PATHS
  #   - Support `/data` endpoints & authz functionality
  # //////////////////////////////////////////////////////////////////////////////////////
  # url where indexd microservice is running (for signed urls primarily)
  # NOTE: Leaving as null will force fence to default to {{BASE_URL}}/index
  # example value: 'https://example.com/index'
  INDEXD: null

  # this is the username which fence uses to make authenticated requests to indexd
  INDEXD_USERNAME: 'amanuensis'
  # this is the password which fence uses to make authenticated requests to indexd
  INDEXD_PASSWORD: ''

  # url where authz microservice is running
  ARBORIST: null
  FENCE: 'http://fence-service'

  # //////////////////////////////////////////////////////////////////////////////////////
  # EMAIL
  #   - Support for sending hubspot API work updates to project management team
  # //////////////////////////////////////////////////////////////////////////////////////
  # Simple Email Service (for sending emails from fence)
  #
  # NOTE: Example in comments below


  HUBSPOT:
    ACCESS_TOKEN: "DEV_KEY"
    
  DB_MIGRATION_POSTGRES_LOCK_KEY: 100
  # //////////////////////////////////////////////////////////////////////////////////////
  # Link to call to the Consolidated Screening List API
  # //////////////////////////////////////////////////////////////////////////////////////
  CSL_API: "https://data.trade.gov/consolidated_screening_list/v1/search?name="
  #Fill in this field with an API key in order to use the Consolidated Screening List API
  CSL_KEY: ""



