{{- if .Values.amanuensisJobs.validateProjectDatapointsJob }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: amanuensis-validate-project-datapoints
  labels:
    redeploy-hash: "{{ .Release.Revision }}"
spec:
  # Job spec starts here directly (no schedule or jobTemplate needed)
  template:
    metadata:
      labels:
        app: gen3job
    spec:
      automountServiceAccountToken: false
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
        - name: data-dictionary-volume
          emptyDir: {}
      initContainers:
        - name: create-data-dictionary-config
          image: "quay.io/cdis/awshelper:stable"
          imagePullPolicy: IfNotPresent
          env:
            - name: DICTIONARY_URL
              value: "https://portal.pedscommons.org/api/v0/submission/_dictionary/_all"
            - name: OUTPUT_FILE
              value: "/tmp/data-dictionary/data_dictionary.json"
          volumeMounts:
            - name: "data-dictionary-volume"
              mountPath: "/tmp/data-dictionary"
          args:
            - /bin/bash
            - -c
            - |
              curl --fail --silent --show-error --retry 3 "$DICTIONARY_URL" -o "$OUTPUT_FILE"
              # a truncated or non-JSON download would silently invalidate every
              # datapoint, so fail the job here instead
              python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$OUTPUT_FILE"
              echo "Data dictionary downloaded successfully."
      containers:
        - name: validate-project-datapoints
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            - name: "data-dictionary-volume"
              mountPath: "/var/www/amanuensis/data_dictionary.json"
              subPath: data_dictionary.json
          args:
            - /bin/bash
            - -c
            - |
              validate-project-datapoints
      restartPolicy: Never
  # Optional: add a backoff limit to control retries
  backoffLimit: 3
{{- end }}
