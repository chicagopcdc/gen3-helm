{{ if .Values.global.externalSecrets.deploy }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: amanuensis-config
spec:
  refreshInterval: 5m
  secretStoreRef:
   {{- if ne .Values.global.externalSecrets.clusterSecretStoreRef  "" }}
    name: {{ .Values.global.externalSecrets.clusterSecretStoreRef }}
    kind: ClusterSecretStore
  {{- else }}
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  {{- end  }}
  target:
    name: amanuensis-config
    creationPolicy: Owner
  data:
  - secretKey: amanuensis-config.yaml
    remoteRef:
      #name of secret in secrets manager
      key: {{include "amanuensis-config" .}}
---
{{- if not .Values.externalSecrets.createK8sJwtKeysSecret}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: amanuensis-jwt-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{include "common.SecretStore" .}}
    kind: SecretStore
  target:
    name: amanuensis-jwt-keys
    creationPolicy: Owner
  data:
  - secretKey: jwt_private_key.pem
    remoteRef:
      #name of secret in secrets manager
      key: {{include "amanuensis-jwt-keys" .}}
  - secretKey: jwt_public_key.pem
    remoteRef:
      key: {{include "amanuensis-jwt-keys" .}}
      property: jwt_public_key.pem
{{- end }}
---
{{- if and .Values.global.externalSecrets.deploy (not .Values.global.externalSecrets.createLocalK8sSecret) }}
{{ include "common.externalSecret.db" . }}
{{- end}}
{{- end}}
