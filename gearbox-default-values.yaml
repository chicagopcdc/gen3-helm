global:
  dev: true
  hostname: localhost
  portal_app: gitops
  dictionaryUrl: https://pcdc-gen3-dictionaries.s3.amazonaws.com/pcdc-schema-demo-amia.json
  authz_entity_name: "subject"

  gearboxMatchingImage:
    repository: "quay.io/pcdc/gearbox_be"
    tag: "pcdc_dev_2026-04-29T11_44_58-05_00"
    pullPolicy: IfNotPresent
    # repository: gearbox-be
    # tag: "test"
    # pullPolicy: Never

arborist:
  #local Dev Only
  postgres:
    password: "arborist_thisisaweakpassword"
  image:
    repository: quay.io/pcdc/arborist
    tag: "2026.03"

fence:
  #local Dev Only
  postgres:
    password: "fence_thisisaweakpassword"
  FENCE_CONFIG:
    DEBUG: true
    MOCK_STORAGE: true
  image:
    repository: "quay.io/pcdc/fence"
    tag: "3.8.4"
    pullPolicy: "IfNotPresent"
  USER_YAML: |
    authz:

      resources:
        - name: portal
          description: data portal service
        - name: 'services'
          subresources:
          - name: 'gearbox'
            subresources:
            - name: 'data-admin'
            - name: 'data-manager'
          - name: 'fence'
            subresources:
              - name: 'admin'

      policies:
        - id: base_access
          resource_paths: ['/portal']
          role_ids: ['base_access']
        - id: 'services.gearbox-data-manager'
          description: 'admin access to most gearbox data endpoints'
          resource_paths: 
          - /services/gearbox/data-manager
          role_ids: 
          - 'data_manager'
        - id: 'services.gearbox-data-admin'
          description: 'admin access to gearbox data'
          role_ids:
            - 'data_admin'
          resource_paths:
            - '/services/gearbox/data-admin'
        - id: 'services.fence-admin'
          description: 'admin access to fence'
          role_ids:
            - 'fence_admin'
          resource_paths:
            - '/services/fence/admin'   

      roles:
        - id: fence_admin
          permissions:
            - id: fence_admin_permission
              action:
                service: 'fence'
                method: '*'
        - id: base_access
          permissions:
            - id: gearbox_access
              action:
                service: '*'
                method: 'read'
        - id: data_manager
          permissions:
            - id: gearbox_data_manager
              action:
                service: 'gearbox'
                method: '*'
        - id: data_admin
          permissions:
            - id: gearbox_data_admin
              action:
                service: '*'
                method: '*'
    users:
      ### BEGIN INTERNS SECTION ###
      ### END INTERNS SECTION ###
      pmurdoch@uchicago.edu:
        admin: true
        policies:
          - base_access
          - services.gearbox-data-manager
          - services.fence-admin
          - services.gearbox-data-admin

portal:
  enabled: true
  image:
    repository: "quay.io/pcdc/gearbox_fe"
